# =============================================================================
# Nightly — runs on every push to the dev branch
# Creates/updates a rolling "nightly" pre-release with dev builds and pushes
# a Docker image tagged "dev" to ghcr.io.
# =============================================================================
name: Nightly

on:
  push:
    branches: [dev]

permissions:
  contents: write
  packages: write

# Cancel any in-progress nightly runs when a new push arrives
concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 1. Prepare — capture metadata for the nightly build
  # ---------------------------------------------------------------------------
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      short_sha: ${{ steps.meta.outputs.short_sha }}
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v6

      - name: Capture metadata
        id: meta
        run: |
          VERSION=$(node -p "require('./package.json').version")
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          IMAGE="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')/core"
          echo "version=${VERSION}-dev.${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "### Nightly build: \`${VERSION}-dev.${SHORT_SHA}\`" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # 2. Build Core — per-OS matrix (native modules need platform-specific build)
  #    Uses @yao-pkg/pkg to produce single-file executables.
  # ---------------------------------------------------------------------------
  build-core:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux
            arch: x64
            pkg_target: node22-linux-x64
          - runner: windows-latest
            platform: windows
            arch: x64
            pkg_target: node22-win-x64
          - runner: macos-latest
            platform: macos
            arch: arm64
            pkg_target: node22-macos-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @kestrel/types generate

      - run: pnpm --filter @kestrel/core build

      - name: Deploy production bundle
        run: pnpm --filter @kestrel/core deploy --prod --legacy kestrel-core-out

      - name: Copy compiled output
        shell: bash
        run: cp -r apps/core/dist kestrel-core-out/dist

      - name: Install pkg
        run: npm install -g @yao-pkg/pkg

      - name: Build executable
        shell: bash
        run: |
          cd kestrel-core-out
          pkg dist/main.js \
            --target ${{ matrix.pkg_target }} \
            --output ../kestrel-core-${{ matrix.platform }}-${{ matrix.arch }}

      - uses: actions/upload-artifact@v6
        with:
          name: kestrel-core-${{ matrix.platform }}-${{ matrix.arch }}
          path: kestrel-core-${{ matrix.platform }}-${{ matrix.arch }}*

  # ---------------------------------------------------------------------------
  # 3. Build Dashboard — single build, cross-compiled for each platform
  #    Next.js standalone is pure JS so cross-compilation works.
  # ---------------------------------------------------------------------------
  build-dashboard:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @kestrel/types generate

      - run: pnpm --filter @kestrel/dashboard build

      - name: Assemble standalone output
        shell: bash
        run: |
          cp -r apps/dashboard/.next/standalone dashboard-standalone

          # Next.js standalone in a monorepo nests under the workspace path
          if [ -d dashboard-standalone/apps/dashboard ]; then
            DASH_DIR="dashboard-standalone/apps/dashboard"
          else
            DASH_DIR="dashboard-standalone"
          fi

          mkdir -p "$DASH_DIR/.next"
          cp -r apps/dashboard/.next/static "$DASH_DIR/.next/static"
          cp -r apps/dashboard/public "$DASH_DIR/public"

          # Debug: show structure
          echo "=== Standalone structure (depth 3) ==="
          find dashboard-standalone -maxdepth 3 -type f | head -40
          echo "=== Entry point ==="

          # Determine entry point
          if [ -f "$DASH_DIR/server.js" ]; then
            ENTRY="$DASH_DIR/server.js"
          else
            ENTRY="dashboard-standalone/server.js"
          fi
          echo "Entry: $ENTRY"
          echo "${ENTRY#dashboard-standalone/}" > dashboard-standalone/.entry

      - name: Configure pkg and build executables
        shell: bash
        run: |
          cd dashboard-standalone
          ENTRY=$(cat .entry)
          echo "Using entry point: $ENTRY"

          node -e "
            const fs = require('fs');
            let pkg = {};
            try { pkg = JSON.parse(fs.readFileSync('package.json', 'utf8')); } catch {}
            pkg.name = pkg.name || 'kestrel-dashboard';
            pkg.pkg = {
              scripts: [
                '.next/server/**/*.js',
                '.next/server/**/*.mjs',
                'apps/**/.next/server/**/*.js',
                'apps/**/.next/server/**/*.mjs'
              ],
              assets: [
                '.next/**/*',
                'public/**/*',
                'apps/**/.next/**/*',
                'apps/**/public/**/*'
              ]
            };
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "
          npm install -g @yao-pkg/pkg
          pkg "$ENTRY" --target node22-linux-x64 --output ../kestrel-dashboard-linux-x64
          pkg "$ENTRY" --target node22-win-x64 --output ../kestrel-dashboard-windows-x64.exe
          pkg "$ENTRY" --target node22-macos-arm64 --output ../kestrel-dashboard-macos-arm64

      - uses: actions/upload-artifact@v6
        with:
          name: kestrel-dashboard-linux-x64
          path: kestrel-dashboard-linux-x64

      - uses: actions/upload-artifact@v6
        with:
          name: kestrel-dashboard-windows-x64
          path: kestrel-dashboard-windows-x64.exe

      - name: Create macOS .app bundle
        shell: bash
        run: |
          APP="Kestrel Dashboard.app"
          mkdir -p "${APP}/Contents/MacOS" "${APP}/Contents/Resources"
          cp kestrel-dashboard-macos-arm64 "${APP}/Contents/MacOS/kestrel-dashboard"
          chmod +x "${APP}/Contents/MacOS/kestrel-dashboard"
          cat > "${APP}/Contents/Info.plist" << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleName</key>
              <string>Kestrel Dashboard</string>
              <key>CFBundleDisplayName</key>
              <string>Kestrel Dashboard</string>
              <key>CFBundleIdentifier</key>
              <string>com.kestrel.dashboard</string>
              <key>CFBundleVersion</key>
              <string>${{ needs.prepare.outputs.version }}</string>
              <key>CFBundleShortVersionString</key>
              <string>${{ needs.prepare.outputs.version }}</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleExecutable</key>
              <string>kestrel-dashboard</string>
              <key>LSMinimumSystemVersion</key>
              <string>11.0</string>
              <key>NSHighResolutionCapable</key>
              <true/>
          </dict>
          </plist>
          PLIST
          zip -ry kestrel-dashboard-macos-arm64.zip "${APP}"

      - uses: actions/upload-artifact@v6
        with:
          name: kestrel-dashboard-macos-arm64
          path: kestrel-dashboard-macos-arm64.zip

  # ---------------------------------------------------------------------------
  # 4. Docker — build and push to ghcr with "dev" tag
  # ---------------------------------------------------------------------------
  docker:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/core/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ needs.prepare.outputs.image }}:dev
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # 5. Nightly Release — delete old nightly + create a fresh one
  # ---------------------------------------------------------------------------
  release:
    needs: [prepare, build-core, build-dashboard, docker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Remove the previous nightly release & tag so we can recreate it
      - name: Delete previous nightly release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete nightly --yes --cleanup-tag 2>/dev/null || true

      - uses: actions/download-artifact@v6
        with:
          path: artifacts
          merge-multiple: true
          pattern: kestrel-*


      - name: List artifacts
        run: find artifacts -type f | sort

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: "Nightly (${{ needs.prepare.outputs.version }})"
          prerelease: true
          body: |
            **Automated nightly build** from the `dev` branch.

            Commit: `${{ github.sha }}`
            Version: `${{ needs.prepare.outputs.version }}`

            > ⚠️ This is a development build and may be unstable.
          files: artifacts/*
