# =============================================================================
# Release — runs when a PR is merged into main
# Creates a GitHub release with changelog, core + dashboard executables, and a
# Docker image pushed to ghcr.io.
# Only rebuilds apps that have changed files in the PR.
# =============================================================================
name: Release

on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: write
  packages: write

jobs:
  # ---------------------------------------------------------------------------
  # 1. Gate — only proceed if the PR was actually merged, detect changes
  # ---------------------------------------------------------------------------
  prepare:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      image: ${{ steps.version.outputs.image }}
      core_changed: ${{ steps.changes.outputs.core }}
      dashboard_changed: ${{ steps.changes.outputs.dashboard }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Extract version from package.json
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          IMAGE="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')/core"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "### Release version: \`v$VERSION\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Detect changed apps
        id: changes
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.merge_commit_sha }}"
          CHANGED=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" 2>/dev/null || echo "")
          echo "Changed files:"
          echo "$CHANGED"

          core=false
          dashboard=false

          # Shared paths trigger both
          if echo "$CHANGED" | grep -qE '^(packages/types/|pnpm-lock\.yaml$|pnpm-workspace\.yaml$)'; then
            core=true
            dashboard=true
          fi

          if echo "$CHANGED" | grep -qE '^apps/core/'; then
            core=true
          fi

          if echo "$CHANGED" | grep -qE '^apps/dashboard/'; then
            dashboard=true
          fi

          echo "core=$core" >> "$GITHUB_OUTPUT"
          echo "dashboard=$dashboard" >> "$GITHUB_OUTPUT"
          echo "Core changed: $core, Dashboard changed: $dashboard" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # 2. Build Core — per-OS matrix (native modules need platform-specific build)
  #    Uses @yao-pkg/pkg to produce single-file executables.
  # ---------------------------------------------------------------------------
  build-core:
    needs: prepare
    if: needs.prepare.outputs.core_changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux
            arch: x64
            pkg_target: node22-linux-x64
          - runner: windows-latest
            platform: windows
            arch: x64
            pkg_target: node22-win-x64
          - runner: macos-latest
            platform: macos
            arch: arm64
            pkg_target: node22-macos-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @kestrel/types generate

      - run: pnpm --filter @kestrel/core build

      - name: Deploy production bundle
        run: pnpm --filter @kestrel/core deploy --prod --legacy kestrel-core-out

      - name: Copy compiled output
        shell: bash
        run: cp -r apps/core/dist kestrel-core-out/dist

      - name: Install pkg
        run: npm install -g @yao-pkg/pkg

      - name: Build executable
        shell: bash
        run: |
          cd kestrel-core-out
          pkg dist/main.js \
            --target ${{ matrix.pkg_target }} \
            --output ../kestrel-core-${{ matrix.platform }}-${{ matrix.arch }}

      - uses: actions/upload-artifact@v6
        with:
          name: kestrel-core-${{ matrix.platform }}-${{ matrix.arch }}
          path: kestrel-core-${{ matrix.platform }}-${{ matrix.arch }}*

  # ---------------------------------------------------------------------------
  # 3. Build Dashboard — single build, cross-compiled for each platform
  #    Next.js standalone is pure JS so cross-compilation works.
  # ---------------------------------------------------------------------------
  build-dashboard:
    needs: prepare
    if: needs.prepare.outputs.dashboard_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @kestrel/types generate

      - run: pnpm --filter @kestrel/dashboard build

      - name: Assemble standalone output
        shell: bash
        run: |
          cp -r apps/dashboard/.next/standalone dashboard-standalone

          # Next.js standalone in a monorepo nests under the workspace path
          if [ -d dashboard-standalone/apps/dashboard ]; then
            DASH_DIR="dashboard-standalone/apps/dashboard"
          else
            DASH_DIR="dashboard-standalone"
          fi

          mkdir -p "$DASH_DIR/.next"
          cp -r apps/dashboard/.next/static "$DASH_DIR/.next/static"
          cp -r apps/dashboard/public "$DASH_DIR/public"

          # Debug: show structure
          echo "=== Standalone structure (depth 3) ==="
          find dashboard-standalone -maxdepth 3 -type f | head -40
          echo "=== Entry point ==="

          # Determine entry point
          if [ -f "$DASH_DIR/server.js" ]; then
            ENTRY="$DASH_DIR/server.js"
          else
            ENTRY="dashboard-standalone/server.js"
          fi
          echo "Entry: $ENTRY"
          echo "${ENTRY#dashboard-standalone/}" > dashboard-standalone/.entry

      - name: Configure pkg and build executables
        shell: bash
        run: |
          cd dashboard-standalone
          ENTRY=$(cat .entry)
          echo "Using entry point: $ENTRY"

          node -e "
            const fs = require('fs');
            let pkg = {};
            try { pkg = JSON.parse(fs.readFileSync('package.json', 'utf8')); } catch {}
            pkg.name = pkg.name || 'kestrel-dashboard';
            pkg.pkg = {
              scripts: [
                '.next/server/**/*.js',
                '.next/server/**/*.mjs',
                'apps/**/.next/server/**/*.js',
                'apps/**/.next/server/**/*.mjs'
              ],
              assets: [
                '.next/**/*',
                'public/**/*',
                'apps/**/.next/**/*',
                'apps/**/public/**/*'
              ]
            };
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "
          npm install -g @yao-pkg/pkg
          pkg "$ENTRY" --target node22-linux-x64 --output ../kestrel-dashboard-linux-x64
          pkg "$ENTRY" --target node22-win-x64 --output ../kestrel-dashboard-windows-x64.exe
          pkg "$ENTRY" --target node22-macos-arm64 --output ../kestrel-dashboard-macos-arm64

      - uses: actions/upload-artifact@v6
        with:
          name: kestrel-dashboard-linux-x64
          path: kestrel-dashboard-linux-x64

      - uses: actions/upload-artifact@v6
        with:
          name: kestrel-dashboard-windows-x64
          path: kestrel-dashboard-windows-x64.exe

      - name: Create macOS .app bundle
        shell: bash
        run: |
          APP="Kestrel Dashboard.app"
          mkdir -p "${APP}/Contents/MacOS" "${APP}/Contents/Resources"
          cp kestrel-dashboard-macos-arm64 "${APP}/Contents/MacOS/kestrel-dashboard"
          chmod +x "${APP}/Contents/MacOS/kestrel-dashboard"
          cat > "${APP}/Contents/Info.plist" << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleName</key>
              <string>Kestrel Dashboard</string>
              <key>CFBundleDisplayName</key>
              <string>Kestrel Dashboard</string>
              <key>CFBundleIdentifier</key>
              <string>com.kestrel.dashboard</string>
              <key>CFBundleVersion</key>
              <string>${{ needs.prepare.outputs.version }}</string>
              <key>CFBundleShortVersionString</key>
              <string>${{ needs.prepare.outputs.version }}</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleExecutable</key>
              <string>kestrel-dashboard</string>
              <key>LSMinimumSystemVersion</key>
              <string>11.0</string>
              <key>NSHighResolutionCapable</key>
              <true/>
          </dict>
          </plist>
          PLIST
          zip -ry kestrel-dashboard-macos-arm64.zip "${APP}"

      - uses: actions/upload-artifact@v6
        with:
          name: kestrel-dashboard-macos-arm64
          path: kestrel-dashboard-macos-arm64.zip

  # ---------------------------------------------------------------------------
  # 4. Docker — build and push to GitHub Container Registry
  # ---------------------------------------------------------------------------
  docker:
    needs: prepare
    if: needs.prepare.outputs.core_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/core/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ needs.prepare.outputs.image }}:latest
            ${{ needs.prepare.outputs.image }}:v${{ needs.prepare.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # 5. Release — create a GitHub release with all artifacts
  # ---------------------------------------------------------------------------
  release:
    needs: [prepare, build-core, build-dashboard, docker]
    if: |
      always() &&
      needs.prepare.result == 'success' &&
      (needs.build-core.result == 'success' || needs.build-core.result == 'skipped') &&
      (needs.build-dashboard.result == 'success' || needs.build-dashboard.result == 'skipped') &&
      (needs.build-core.result == 'success' || needs.build-dashboard.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v6
        with:
          path: artifacts
          merge-multiple: true
          pattern: kestrel-*


      - name: List artifacts
        run: find artifacts -type f | sort

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          name: v${{ needs.prepare.outputs.version }}
          generate_release_notes: true
          files: artifacts/*
