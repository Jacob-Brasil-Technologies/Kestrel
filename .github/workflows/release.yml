# =============================================================================
# Release — runs when a PR is merged into main
# Creates a GitHub release with changelog, core + dashboard executables, and a
# Docker image pushed to ghcr.io.
# =============================================================================
name: Release

on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: write
  packages: write

jobs:
  # ---------------------------------------------------------------------------
  # 1. Gate — only proceed if the PR was actually merged
  # ---------------------------------------------------------------------------
  prepare:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      image: ${{ steps.version.outputs.image }}
    steps:
      - uses: actions/checkout@v6

      - name: Extract version from package.json
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          IMAGE="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')/core"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "### Release version: \`v$VERSION\`" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # 2. Build Core — per-OS matrix (native modules need platform-specific build)
  #    Uses @yao-pkg/pkg to produce single-file executables.
  # ---------------------------------------------------------------------------
  build-core:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux
            arch: x64
            pkg_target: node22-linux-x64
          - runner: windows-latest
            platform: windows
            arch: x64
            pkg_target: node22-win-x64
          - runner: macos-latest
            platform: macos
            arch: arm64
            pkg_target: node22-macos-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @kestrel/types generate

      - run: pnpm --filter @kestrel/core build

      - name: Deploy production bundle
        run: pnpm --filter @kestrel/core deploy --prod --legacy kestrel-core-out

      - name: Copy compiled output
        shell: bash
        run: cp -r apps/core/dist kestrel-core-out/dist

      - name: Install pkg
        run: npm install -g @yao-pkg/pkg

      - name: Build executable
        shell: bash
        run: |
          cd kestrel-core-out
          pkg dist/main.js \
            --target ${{ matrix.pkg_target }} \
            --output ../kestrel-core-${{ matrix.platform }}-${{ matrix.arch }}

      - uses: actions/upload-artifact@v6
        with:
          name: kestrel-core-${{ matrix.platform }}-${{ matrix.arch }}
          path: kestrel-core-${{ matrix.platform }}-${{ matrix.arch }}*

  # ---------------------------------------------------------------------------
  # 3. Build Dashboard — single build, cross-compiled for each platform
  #    Next.js standalone is pure JS so cross-compilation works.
  # ---------------------------------------------------------------------------
  build-dashboard:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @kestrel/types generate

      - run: pnpm --filter @kestrel/dashboard build

      - name: Assemble standalone output
        shell: bash
        run: |
          cp -r apps/dashboard/.next/standalone dashboard-standalone

          # Next.js standalone in a monorepo nests under the workspace path
          if [ -d dashboard-standalone/apps/dashboard ]; then
            DASH_DIR="dashboard-standalone/apps/dashboard"
          else
            DASH_DIR="dashboard-standalone"
          fi

          mkdir -p "$DASH_DIR/.next"
          cp -r apps/dashboard/.next/static "$DASH_DIR/.next/static"
          cp -r apps/dashboard/public "$DASH_DIR/public"

          # Debug: show structure
          echo "=== Standalone structure (depth 3) ==="
          find dashboard-standalone -maxdepth 3 -type f | head -40
          echo "=== Entry point ==="

          # Determine entry point
          if [ -f "$DASH_DIR/server.js" ]; then
            ENTRY="$DASH_DIR/server.js"
          else
            ENTRY="dashboard-standalone/server.js"
          fi
          echo "Entry: $ENTRY"
          echo "${ENTRY#dashboard-standalone/}" > dashboard-standalone/.entry

      - name: Configure pkg and build executables
        shell: bash
        run: |
          cd dashboard-standalone
          ENTRY=$(cat .entry)
          echo "Using entry point: $ENTRY"

          node -e "
            const fs = require('fs');
            let pkg = {};
            try { pkg = JSON.parse(fs.readFileSync('package.json', 'utf8')); } catch {}
            pkg.name = pkg.name || 'kestrel-dashboard';
            pkg.pkg = {
              scripts: [
                '.next/server/**/*.js',
                '.next/server/**/*.mjs',
                'apps/**/.next/server/**/*.js',
                'apps/**/.next/server/**/*.mjs'
              ],
              assets: [
                '.next/**/*',
                'public/**/*',
                'apps/**/.next/**/*',
                'apps/**/public/**/*'
              ]
            };
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "
          npm install -g @yao-pkg/pkg
          pkg "$ENTRY" --target node22-linux-x64 --output ../kestrel-dashboard-linux-x64
          pkg "$ENTRY" --target node22-win-x64 --output ../kestrel-dashboard-windows-x64.exe
          pkg "$ENTRY" --target node22-macos-arm64 --output ../kestrel-dashboard-macos-arm64

      - uses: actions/upload-artifact@v6
        with:
          name: kestrel-dashboard-linux-x64
          path: kestrel-dashboard-linux-x64

      - uses: actions/upload-artifact@v6
        with:
          name: kestrel-dashboard-windows-x64
          path: kestrel-dashboard-windows-x64.exe

      - uses: actions/upload-artifact@v6
        with:
          name: kestrel-dashboard-macos-arm64
          path: kestrel-dashboard-macos-arm64

  # ---------------------------------------------------------------------------
  # 4. Docker — build and push to GitHub Container Registry
  # ---------------------------------------------------------------------------
  docker:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/core/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ needs.prepare.outputs.image }}:latest
            ${{ needs.prepare.outputs.image }}:v${{ needs.prepare.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # 5. Release — create a GitHub release with all artifacts
  # ---------------------------------------------------------------------------
  release:
    needs: [prepare, build-core, build-dashboard, docker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v6
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: find artifacts -type f | sort

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          name: v${{ needs.prepare.outputs.version }}
          generate_release_notes: true
          files: artifacts/*
